spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8080}

springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# Адреса сервисов
gateway.routes.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8081}
gateway.routes.help-service-url=${HELP_SERVICE_URL:http://localhost:8082}

# JWT: значения должны совпадать с настройками выдачи токенов в Auth
security.jwt.secret=aUZVCIL7v0iSZjYVkb0GkQxSDkVT96eClKaG+M3DUvE=
security.jwt.issuer=volunteer-app
security.jwt.audience=volunteer-api
security.jwt.clock-skew=30s

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Таймауты исходящих запросов Gateway
# connect-timeout задаётся в миллисекундах
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# Actuator не публикуется через HTTP
management.endpoints.web.exposure.exclude=*

# Персональные лимиты: PUBLIC — по IP, PROTECTED — по UUID пользователя
gateway.rate-limits.endpoints[registerUser]=5
gateway.rate-limits.endpoints[login]=10
gateway.rate-limits.endpoints[refreshTokens]=30
gateway.rate-limits.endpoints[logout]=30
gateway.rate-limits.endpoints[createTask]=10
gateway.rate-limits.endpoints[listTasks]=120
gateway.rate-limits.endpoints[getTask]=120
gateway.rate-limits.endpoints[updateTask]=30
gateway.rate-limits.endpoints[deleteTask]=10
gateway.rate-limits.endpoints[createTaskResponse]=20
gateway.rate-limits.endpoints[listTaskResponses]=60
gateway.rate-limits.endpoints[getTaskResponse]=60
gateway.rate-limits.endpoints[decideTaskResponse]=30
gateway.rate-limits.endpoints[withdrawTaskResponse]=20
gateway.rate-limits.endpoints[listMyResponses]=60
gateway.rate-limits.endpoints[changeTaskStatus]=20

# Общие лимиты каждого маршрута для всех клиентов вместе
gateway.rate-limits.global-endpoints[registerUser]=100
gateway.rate-limits.global-endpoints[login]=300
gateway.rate-limits.global-endpoints[refreshTokens]=600
gateway.rate-limits.global-endpoints[logout]=300
gateway.rate-limits.global-endpoints[createTask]=200
gateway.rate-limits.global-endpoints[listTasks]=3000
gateway.rate-limits.global-endpoints[getTask]=3000
gateway.rate-limits.global-endpoints[updateTask]=600
gateway.rate-limits.global-endpoints[deleteTask]=200
gateway.rate-limits.global-endpoints[createTaskResponse]=400
gateway.rate-limits.global-endpoints[listTaskResponses]=1200
gateway.rate-limits.global-endpoints[getTaskResponse]=1200
gateway.rate-limits.global-endpoints[decideTaskResponse]=600
gateway.rate-limits.global-endpoints[withdrawTaskResponse]=400
gateway.rate-limits.global-endpoints[listMyResponses]=1200
gateway.rate-limits.global-endpoints[changeTaskStatus]=400